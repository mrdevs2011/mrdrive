<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRdrive</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="screen" style="display:none;">
    <div class="auth-box">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="#18181b"/>
          <path d="M10 26V14L20 22L30 14V26" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <h1>MRdrive</h1>

      <div id="login-form">
        <p class="form-title">Kirish</p>
        <input type="text" id="login-username" placeholder="Username" />
        <input type="password" id="login-password" placeholder="Parol" />
        <button onclick="login()">Kirish</button>
        <p class="switch-link">Akkaunt yo'qmi? <a onclick="showSignup()">Ro'yxatdan o'tish</a></p>
      </div>

      <div id="signup-form" style="display:none;">
        <p class="form-title">Ro'yxatdan o'tish</p>
        <input type="text" id="signup-name" placeholder="Ismingiz" />
        <input type="text" id="signup-username" placeholder="Username" />
        <input type="password" id="signup-password" placeholder="Parol (min 6 belgi)" />
        <button onclick="signup()">Ro'yxatdan o'tish</button>
        <p class="switch-link">Akkaunt bormi? <a onclick="showLogin()">Kirish</a></p>
      </div>

      <p id="auth-status"></p>
    </div>
  </div>

  <!-- INITIAL LOADER -->
  <div id="boot-loader">
    <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
      <rect width="40" height="40" rx="10" fill="#18181b"/>
      <path d="M10 26V14L20 22L30 14V26" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>

  <!-- APP SCREEN -->
  <div id="app" class="screen" style="display:none;">
    <header>
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="#18181b"/>
          <path d="M10 26V14L20 22L30 14V26" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <h1>MRdrive</h1>
      </div>
      <div>
        <span id="user-email"></span>
        <button onclick="logout()">Chiqish</button>
      </div>
    </header>

    <div id="dropzone" class="dropzone">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" class="dz-icon">
        <path d="M12 16V4M12 4L7 9M12 4L17 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 16V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p>Drag and drop yoki CTRL+V yoki <label for="file-input" class="upload-label">fayl tanlash</label></p>
      <input type="file" id="file-input" multiple hidden />
    </div>

    <div id="upload-progress"></div>

    <div id="file-list" class="file-list"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
