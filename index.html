<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRdrive</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="screen">
    <div class="auth-box">
      <h1>MRdrive</h1>

      <div id="login-form">
        <p>Kirish</p>
        <input type="text" id="login-username" placeholder="Username" />
        <input type="password" id="login-password" placeholder="Parol" />
        <button onclick="login()">Kirish</button>
        <p class="switch-link">Akkaunt yo'qmi? <a onclick="showSignup()">Ro'yxatdan o'tish</a></p>
      </div>

      <div id="signup-form" style="display:none;">
        <p>Ro'yxatdan o'tish</p>
        <input type="text" id="signup-name" placeholder="Ismingiz" />
        <input type="text" id="signup-username" placeholder="Username" />
        <input type="password" id="signup-password" placeholder="Parol (min 6 belgi)" />
        <button onclick="signup()">Ro'yxatdan o'tish</button>
        <p class="switch-link">Akkaunt bormi? <a onclick="showLogin()">Kirish</a></p>
      </div>

      <p id="auth-status"></p>
    </div>
  </div>

  <!-- APP SCREEN -->
  <div id="app" class="screen" style="display:none;">
    <header>
      <h1>MRdrive</h1>
      <div>
        <span id="user-email"></span>
        <button onclick="logout()">Chiqish</button>
      </div>
    </header>

    <div id="dropzone" class="dropzone">
      Drag and drop yoki CTRL+V yoki <label for="file-input" class="upload-label">fayl tanlash</label>
      <input type="file" id="file-input" multiple hidden />
    </div>

    <div id="upload-progress"></div>

    <div id="file-list" class="file-list"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
