<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MRdrive</title>

<!-- Inline SVG favicon (same as the splash logo) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2318181b'/%3E%3Cpath d='M10 26V14L20 22L30 14V26' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- INITIAL LOADER -->
  <div id="boot-loader">
    <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
      <rect width="40" height="40" rx="10" fill="#18181b"/>
      <path d="M10 26V14L20 22L30 14V26" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>

  <!-- APP SCREEN -->
  <div id="app" class="screen" style="display:none;">
    <header>
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="#18181b"/>
          <path d="M10 26V14L20 22L30 14V26" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <h1>MRdrive</h1>
      </div>
      <div class="header-right">
        <div class="settings-wrap">
          <button type="button" class="gear-btn" id="gear-btn" title="Sozlamalar" aria-label="Sozlamalar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
          <div class="settings-modal" id="settings-modal" hidden>
            <a href="/mcp" class="settings-item settings-link">
              <img class="claude-icon" src="/claude-icon.png" width="18" height="18" alt="" />
              Claude ga ulang
            </a>
            <button type="button" class="settings-item" id="settings-account-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
              Hisob
            </button>
            <div class="settings-account-panel" id="settings-account-panel" hidden>
              <div class="settings-account-row">
                <span class="settings-account-label">Ism</span>
                <span class="settings-account-value" id="account-name">—</span>
              </div>
              <div class="settings-account-row">
                <span class="settings-account-label">Foydalanuvchi nomi</span>
                <span class="settings-account-value" id="account-username">—</span>
              </div>
            </div>
            <label class="settings-item settings-toggle" for="settings-skip-delete">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7h16"/><path d="M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12"/><path d="M9 7V4h6v3"/>
              </svg>
              <span class="settings-toggle-text">O'chirishdan oldin so'ramaslik</span>
              <input type="checkbox" id="settings-skip-delete" class="settings-switch" />
            </label>
            <div class="settings-divider"></div>
            <button type="button" class="settings-item settings-logout" id="settings-logout-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Chiqish
            </button>
            <div class="settings-divider"></div>
            <div class="usage-box" id="usage-box">
              <div class="usage-head">
                <span class="usage-title">Xotira</span>
                <span class="usage-pct" id="usage-pct">—</span>
              </div>
              <div class="usage-bar" id="usage-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
                <span class="usage-seg seg-video" id="usage-seg-video"></span>
                <span class="usage-seg seg-image" id="usage-seg-image"></span>
                <span class="usage-seg seg-file" id="usage-seg-file"></span>
              </div>
              <div class="usage-total" id="usage-total">Yuklanmoqda…</div>
              <div class="usage-cats">
                <div class="usage-cat"><span class="usage-cat-label"><i class="dot seg-video"></i>Video</span><b id="usage-video">—</b></div>
                <div class="usage-cat"><span class="usage-cat-label"><i class="dot seg-image"></i>Rasm</span><b id="usage-image">—</b></div>
                <div class="usage-cat"><span class="usage-cat-label"><i class="dot seg-file"></i>Fayl</span><b id="usage-file">—</b></div>
              </div>
              <div class="usage-note" id="usage-note" hidden></div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div id="dropzone" class="dropzone">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" class="dz-icon">
        <path d="M12 16V4M12 4L7 9M12 4L17 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 16V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p>Tortib tashlang, CTRL+V bosing yoki <label for="file-input" class="upload-label">fayl tanlang</label></p>
      <input type="file" id="file-input" multiple hidden />
    </div>

    <div id="upload-progress"></div>

    <div id="file-list" class="file-list"></div>
  </div>

  <!-- ANNOTATION VIEWER -->
  <div id="annot-viewer" class="annot-viewer" style="display:none;" aria-hidden="true">
    <div class="annot-topbar">
      <button class="annot-btn" id="annot-close" title="Yopish">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M6 18L18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <span class="annot-filename" id="annot-filename"></span>
      <div class="annot-top-actions">
        <button class="annot-btn" id="annot-edit" title="Tahrirlash">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 20H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16.5 3.5C17.3284 2.67157 18.6716 2.67157 19.5 3.5C20.3284 4.32843 20.3284 5.67157 19.5 6.5L7 19L3 20L4 16L16.5 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <button class="annot-btn is-save" id="annot-save" title="Yuklab olish">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 4V16M12 16L7 11M12 16L17 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 18H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="annot-btn" id="annot-fullscreen" title="To'liq ekran">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 9V4H9M15 4H20V9M20 15V20H15M9 20H4V15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="annot-toolbar" id="annot-toolbar" style="display:none;"></div>

    <div class="annot-workspace" id="annot-workspace">
      <div class="annot-scroll" id="annot-scroll"></div>
    </div>

    <div class="annot-status" id="annot-status">
      <span id="annot-tool-hint">1 barmoq = chizish · 2 barmoq = surish / zoom</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <script src="/api/config.js"></script>
  <script src="/scrollbar.js"></script>
  <script src="/app.js"></script>
</body>
</html>
